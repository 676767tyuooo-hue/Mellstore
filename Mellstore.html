*{box-sizing:border-box}

.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}

.tag{font-size:10px;padding:1px 6px;border-radius:99px;background:#f59e0b;color:#fff;margin-left:4px;vertical-align:middle}

</style></head><body><div class="w" id="app"></div>
<script>
const G=["linear-gradient(90deg,#ff0080,#ff8c00)","linear-gradient(90deg,#00c6ff,#0072ff)","linear-gradient(90deg,#11998e,#38ef7d)","linear-gradient(90deg,#8e2de2,#4a00e0)","linear-gradient(90deg,#f12711,#f5af19)","linear-gradient(90deg,#ee9ca7,#a18cd1)","linear-gradient(90deg,#fc00ff,#00dbde)","linear-gradient(90deg,#f7971e,#ffd200)","linear-gradient(90deg,#43e97b,#38f9d7)","linear-gradient(90deg,#fa709a,#fee140)","linear-gradient(90deg,#30cfd0,#7b2ff7)","linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#8b00ff)"];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let S;try{S=JSON.parse(localStorage.getItem("mell1"))}catch(e){}

function rd(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=128;c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);cb(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(f)}
let FF=null;
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open("mell",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=()=>no()}catch(e){no()}});
const fput=(id,f)=>idb().then(d=>d.transaction("f","readwrite").objectStore("f").put(f,id)).catch(()=>{});
const fget=id=>idb().then(d=>new Promise(ok=>{const r=d.transaction("f").objectStore("f").get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})).catch(()=>null);
const fdel=id=>idb().then(d=>d.transaction("f","readwrite").objectStore("f").delete(id)).catch(()=>{});
const pf=el=>{FF=el.files[0]||null};
const st=(k,v)=>{S.set[k]=v;save();R()};
function delacc(){if(!confirm("Удалить аккаунт и все твои приложения?"))return;const n=S.me;S.apps.filter(a=>a.by.toLowerCase()===n).forEach(a=>fdel(a.id));S.apps=S.apps.filter(a=>a.by.toLowerCase()!==n);S.users=S.users.filter(u=>u.n.toLowerCase()!==n);S.me=null;V="store";save();R()}
async function openf(id){const a=S.apps.find(x=>x.id===id),f=await fget(id);if(!f)return alert("Файл не найден в памяти этого браузера");
 if(/\.html?$/i.test(a.fn)){const t=await f.text();document.body.insertAdjacentHTML("beforeend",'<div class="mod" id="md"><button class="b" onclick="md.remove()">✕ Закрыть</button><iframe sandbox="allow-scripts"></iframe></div>');document.querySelector("#md iframe").srcdoc=t;return}
 try{const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:a.fn,data:f})}catch(e){if(!e||e.code!=="declined")alert("Этот формат (например .apk) нельзя сохранить из браузерной версии")}}
function sets(){const u=me(),s=S.set;
 return `<div class="c"><h3 style="margin-top:0">⚙️ Настройки</h3>
 <div class="sw"><span>Сервер</span><input style="width:58%" placeholder="http://адрес:3000" value="${esc(API)}" onchange="try{localStorage.setItem('mell_srv',this.value.trim())}catch(e){}location.reload()"></div>
 <div class="sw"><span>Тема</span><select style="width:auto" onchange="st('theme',this.value)">${[["auto","Авто"],["light","Светлая"],["dark","Тёмная"]].map(x=>`<option value="${x[0]}" ${s.theme===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>
 <div class="sw"><span>Переливание ников</span><input type="checkbox" style="width:auto" ${s.anim?"checked":""} onchange="st('anim',this.checked?1:0)"></div>
 <div class="sw"><span>Одна колонка в сетке</span><input type="checkbox" style="width:auto" ${s.dense?"checked":""} onchange="st('dense',this.checked?1:0)"></div>
 <div class="sw"><span>Мяуканье котёнка 🐱</span><input type="checkbox" style="width:auto" ${s.snd!==0?"checked":""} onchange="st('snd',this.checked?1:0)"></div>
 
 ${u?'<div class="row"><button class="b d" onclick="delacc()">Удалить аккаунт</button></div>':""}</div>`}
let AC;function meow(){if(S.set.snd===0)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[0,.9].forEach((dt,k)=>{const t=AC.currentTime+dt,o=AC.createOscillator(),o2=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter(),h=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o2.type="triangle";[o,o2].forEach((x,i)=>{const m=i?2:1;x.frequency.setValueAtTime(700*m*(1+k*.15),t);x.frequency.exponentialRampToValueAtTime(1250*m*(1+k*.15),t+.12);x.frequency.setValueAtTime(1250*m*(1+k*.15),t+.2);x.frequency.exponentialRampToValueAtTime(600*m*(1+k*.15),t+.75)});l.frequency.value=22;lg.gain.value=25;l.connect(lg);lg.connect(o.frequency);f.type="bandpass";f.Q.value=6;f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(2800,t+.15);f.frequency.exponentialRampToValueAtTime(1300,t+.75);h.type="highpass";h.frequency.value=500;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.45,t+.06);g.gain.setValueAtTime(.45,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.connect(f);o2.connect(f);f.connect(h);h.connect(g);g.connect(AC.destination);[o,o2,l].forEach(x=>{x.start(t);x.stop(t+.85)})})}catch(e){}}
function logoFx(el){meow();el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,E=["🐱","🐾","💜","✨","🍬","😸","⭐"],rg=document.createElement("div");rg.className="rg";rg.style.left=x+"px";rg.style.top=y+"px";document.body.appendChild(rg);setTimeout(()=>rg.remove(),900);
 for(let i=0;i<12;i++){const s=document.createElement("span"),a=Math.PI*2*i/12+Math.random()*.5,d=70+Math.random()*80;s.className="fx";s.textContent=E[i%E.length];s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-30}px;--r:${(Math.random()-.5)*120}deg;animation-delay:${i*15}ms`;document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function pimg(el){rd(el.files[0],d=>{T=d;const p=document.getElementById("pv");p.src=d;p.style.display="block"})}
function ava(el){rd(el.files[0],d=>{me().av=d;save();R()})}
const me=()=>S.users.find(u=>u.n.toLowerCase()===S.me);
const usr=n=>S.users.find(u=>u.n===n)||{n,g:3,i:0};
const isSup=u=>u&&u.role==="super",isAdm=u=>u&&(u.role==="super"||u.role==="mod");
const nk=u=>`${u.av?`<img class="av" src="${u.av}">`:""}<span>${I[u.i]||""}</span> <span class="nk ${u.an?"an":""}" style="background-image:${G[u.g]||G[0]}">${esc(u.n)}</span>${isSup(u)?'<span class="tag">SUPER</span>':u.role==="mod"?'<span class="tag" style="background:#3b82f6">MOD</span>':""}`;
const lvl=a=>Math.min(4,a.b+Math.floor(a.inst/3));
function reg(login){const n=document.getElementById("n").value.trim(),p=document.getElementById("p").value;
 if(!/^[\wа-яё]{2,16}$/i.test(n)){aerr="Ник: 2–16 символов, буквы, цифры, _";return R()}
 if(p.length<4){aerr="Пароль минимум 4 символа";return R()}
 const h=btoa(unescape(encodeURIComponent(p))),u=S.users.find(x=>x.n.toLowerCase()===n.toLowerCase());
 if(login){if(!u||u.p!==h){aerr="Неверный ник или пароль";return R()}if(u.ban){aerr="Аккаунт заблокирован";return R()}}
 else{if(u){aerr="Ник занят";return R()}
  const sp=SUPER.includes(n.toLowerCase());
  S.users.push({n,p:h,role:sp?"super":"user",g:sp?11:S.users.length%11,i:sp?(n.toLowerCase()==="хлеб"?5:1):0,an:sp,ban:0})}
 S.me=n.toLowerCase();aerr="";V="store";save();R()}
const out0=()=>{S.me=null;V="store";save();R()};
function instl(id){const u=me();if(!u)return V="auth",R();const a=S.apps.find(x=>x.id===id);const k=u.n+id;
 if(!u.in)u.in=[];const i=u.in.indexOf(id);if(i<0){u.in.push(id);a.inst++}else{u.in.splice(i,1);a.inst--}save();R()}
function sub(){const g=x=>document.getElementById(x).value.trim();if(!g("an")||!g("ad"))return alert("Заполни название и описание");if(!FF)return alert("Выбери файл приложения из памяти телефона");
 const u=me();fput(S.nid,FF);S.apps.push({fn:FF.name,fs:FF.size,id:S.nid++,name:g("an"),ic:g("ai")||"📦",img:T,d:g("ad"),c:g("ac"),by:u.n,st:isAdm(u)?"ok":"pend",b:0,inst:0,rate:4});T=null;FF=null;save();V="store";R()}
const A={ok:id=>{S.apps.find(a=>a.id===id).st="ok";save();R()},no:id=>{S.apps=S.apps.filter(a=>a.id!==id);fdel(id);save();R()}};

function card(a){const u=me(),on=u&&u.in&&u.in.includes(a.id),l=lvl(a);
 return `<div class="c t"><div class="ap"><div class="ic">${ico(a)}</div><b>${esc(a.name)}</b><div class="mu">${esc(a.c)}</div><div class="mu">${nk(usr(a.by))}</div></div>
 <p class="mu">${esc(a.d)}</p><div class="mu">${a.inst} уст. · ${esc(a.fn||"")}</div>
 <div class="row"><button class="b ${on?"":"p"}" onclick="instl(${a.id})">${on?"Удалить":"Установить"}</button>${on&&a.fn?`<button class="b" onclick="openf(${a.id})">${/\.html?$/i.test(a.fn)?"Открыть":"Сохранить"}</button>`:""}</div></div>`}

 return `<input placeholder="🔍 Поиск приложений" value="${esc(q)}" oninput="q=this.value;R(1)">
 <div class="row"><button class="b ${cat?"":"on"}" onclick="cat='';R()">Все</button>${CATS.map(c=>`<button class="b ${cat===c?"on":""}" onclick="cat='${c}';R()">${c}</button>`).join("")}</div>
 <h3>Приложения</h3><div class="g ${S.set.dense?"d1":""}">${l.map(card).join("")||'<p class="mu">Пока здесь пусто. Зарегистрируйся и добавь первое приложение!</p>'}</div>`}
function auth(){return `<div class="c" style="max-width:360px;margin:20px auto"><h3 style="margin-top:0">Вход / регистрация</h3>

function prof(){const u=me();return `<div class="c"><h3 style="margin-top:0">${nk(u)}</h3><p class="mu">Роль: ${u.role}. Установлено: ${(u.in||[]).length}</p>

 <b>Иконка рядом с ником</b><div class="pk" style="margin:8px 0">${I.map((x,i)=>`<span class="${u.i===i?"s":""}" onclick="pick('i',${i})">${x}</span>`).join("")}</div>

function subm(){return `<div class="c"><h3 style="margin-top:0">Добавить приложение</h3><input id="an" placeholder="Название"><div style="height:8px"></div><b>Иконка из галереи</b><input id="af" type="file" accept="image/*" onchange="pimg(this)"><img id="pv" class="ic" style="display:none;margin:6px 0;width:64px;height:64px;object-fit:cover"><input id="ai" placeholder="или эмодзи, например 🎲" maxlength="4"><div style="height:8px"></div>
 <textarea id="ad" rows="3" placeholder="Описание"></textarea><div style="height:8px"></div><b>Файл приложения (из памяти телефона)</b><input id="ff" type="file" onchange="pf(this)"><div style="height:8px"></div><select id="ac">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>

function adm(){const u=me();if(!isAdm(u))return"";const pend=S.apps.filter(a=>a.st==="pend");
 let h=`<div class="row"><button class="b ${AT==="apps"?"on":""}" onclick="AT='apps';R()">Приложения ${pend.length?"("+pend.length+")":""}</button>${isSup(u)?`<button class="b ${AT==="us"?"on":""}" onclick="AT='us';R()">Пользователи</button>`:""}</div>`;
